<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b5a34" />
    <meta
      name="description"
      content="MUSA Andijon — muzlatilgan mahsulotlar: yarim tayyor (chuchvara, manti, somsa, kotlet), muzqaymoq va siroklar. Andijon shahri bo‘ylab Telegram orqali buyurtma bering, eshigingizgacha yetkazamiz."
    />
    <title>MUSA Andijon — Muzlatilgan mahsulotlar</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <!-- Mahsulot rasmlari shu yerdan — ulanish oldindan ochiladi -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/musa-wordmark.webp" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <!--
      Ochilish animatsiyasi — logodagi yashil fonda sariq «MUSA» lavhasi
      kattalashib paydo bo'ladi, ostidan «ANDIJON» yozuvi chiqadi.

      ATAYLAB shu yerda, oddiy (module bo'lmagan) skript bilan: React va
      JavaScript bundle yuklanishini kutmay, Telegram oynani ochgan zahoti
      chiziladi — oq chaqnash bo'lmaydi.

      Qoidalar:
        - ilova tayyor bo'lganda tugaydi (window 'musa:ready'), lekin kamida
          animatsiya ko'rinib ulguradi va 2,6 soniyadan ortiq kutilmaydi;
        - bosilsa darhol o'tkazib yuboriladi;
        - bir kunda qayta ochilganda — qisqaroq;
        - «harakatni kamaytirish» yoqilgan telefonda — oddiy so'nish.
    -->
    <style id="splash-style">
      #splash {
        position: fixed; inset: 0; z-index: 2147483000; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(120% 80% at 50% 40%, #0a9a50 0%, #038141 55%, #025a2d 100%);
        touch-action: none; -webkit-tap-highlight-color: transparent;
        font-family: Unbounded, Manrope, system-ui, sans-serif;
      }
      #splash .sp-mark { width: 248px; max-width: 72vw; opacity: 0; transform: scale(0.7);
        filter: drop-shadow(0 18px 36px rgba(0, 40, 20, 0.45));
        animation: spMarkIn 0.7s cubic-bezier(0.2, 0.9, 0.25, 1.2) 0.05s forwards; }
      #splash .sp-mark img { width: 100%; height: auto; display: block; }
      #splash .sp-word { text-align: center; color: #fff; opacity: 0; transform: translateY(10px); animation: spUp 0.5s ease 0.45s forwards; }
      #splash .sp-word small { display: block; font: 800 13px Manrope, system-ui, sans-serif; letter-spacing: 0.5em; color: #ffe08a; padding-left: 0.5em; }
      #splash.is-leaving { opacity: 0; transform: scale(1.04); transition: opacity 0.45s ease, transform 0.45s ease; }
      #splash.is-quick.is-leaving { transition-duration: 0.32s; }
      @keyframes spMarkIn { to { opacity: 1; transform: none; } }
      @keyframes spUp { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #splash, #splash * { animation: none !important; }
        #splash .sp-mark, #splash .sp-word { opacity: 1; transform: none; }
      }
    </style>
    <div id="splash" aria-hidden="true">
      <div class="sp-mark"><img src="/musa-wordmark.webp" alt="" width="480" height="179" /></div>
      <div class="sp-word"><small>ANDIJON</small></div>
    </div>
    <script>
      (function () {
        var root = document.getElementById('splash')
        if (!root) return
        var html = document.documentElement
        html.setAttribute('data-splash', 'on')

        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        var today = new Date().toDateString()
        var quick = reduce
        try {
          if (localStorage.getItem('musaSplashDay') === today) quick = true
          localStorage.setItem('musaSplashDay', today)
        } catch (e) { /* xotira yopiq — to'liq variant */ }
        if (quick) root.classList.add('is-quick')

        // Telegram paneli splash rangida — pastda oq chiziq qolmasin
        try {
          var tg = window.Telegram && window.Telegram.WebApp
          if (tg) {
            if (tg.setHeaderColor) tg.setHeaderColor('#038141')
            if (tg.setBackgroundColor) tg.setBackgroundColor('#025a2d')
          }
        } catch (e) { /* eski Telegram */ }

        var start = performance.now()
        var MIN = quick ? 380 : 1000
        var MAX = 2600
        var ready = false
        var done = false
        var cleaned = false

        function whenReady() {
          if (!ready || done) return
          var left = MIN - (performance.now() - start)
          if (left > 0) setTimeout(finish, left)
          else finish()
        }
        window.addEventListener('musa:ready', function () { ready = true; whenReady() })
        root.addEventListener('pointerdown', finish)
        setTimeout(finish, MAX)

        function finish() {
          if (done) return
          done = true
          // Kafolat: kadrlar to'xtab qolsa ham (ilova fonga o'tgan bo'lsa)
          // splash ilovani yopib qolmaydi
          setTimeout(cleanup, 1200)
          if (document.hidden) { cleanup(); return }
          root.classList.add('is-leaving')
          setTimeout(cleanup, quick ? 340 : 480)
        }

        function cleanup() {
          if (cleaned) return
          cleaned = true
          root.remove()
          var style = document.getElementById('splash-style')
          if (style) style.remove()
          html.removeAttribute('data-splash')
          window.dispatchEvent(new Event('musa:splash-done'))
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
